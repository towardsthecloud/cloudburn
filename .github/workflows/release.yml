name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      published-release-ref:
        description: 'Recover tags, GitHub releases, and Homebrew for an already-published release commit (no npm publish)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create Release PR or Publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.published-release-ref || github.sha }}

      - name: Validate recovery checkout before running repository code
        if: inputs.published-release-ref != ''
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(find .changeset -name '*.md' ! -name README.md -print)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify existing npm versions before recovery
        if: inputs.published-release-ref != ''
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          for PACKAGE in rules sdk cloudburn; do
            NAME=$(node -p "require('./packages/${PACKAGE}/package.json').name")
            VERSION=$(node -p "require('./packages/${PACKAGE}/package.json').version")
            PUBLISHED_VERSION=$(npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org)
            test "$PUBLISHED_VERSION" = "$VERSION"
            ATTESTATION_URL=$(npm view "${NAME}@${VERSION}" dist.attestations.url --registry=https://registry.npmjs.org)
            PUBLISHED_SHA=$(curl -fsSL "$ATTESTATION_URL" \
              | jq -r '.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload' \
              | base64 --decode \
              | jq -er --arg repository "git+https://github.com/${GITHUB_REPOSITORY}@refs/heads/main" \
                '.predicate.buildDefinition.resolvedDependencies[] | select(.uri == $repository) | .digest.gitCommit')
            test "$PUBLISHED_SHA" = "$RELEASE_SHA"
            TAG="${NAME}@${VERSION}"
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              test "$(git rev-parse "${TAG}^{commit}")" = "$RELEASE_SHA"
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          publish-script: ${{ inputs.published-release-ref != '' && 'pnpm exec changeset git-tag' || 'pnpm release' }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # Recovery tags must point at the checked-out release, not the workflow dispatch commit.
          push-with-git-cli: true
          # Recovery verifies remote tags before creating releases itself.
          create-github-releases: ${{ inputs.published-release-ref == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

      - name: Recover missing GitHub releases
        if: inputs.published-release-ref != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(mktemp)
          trap 'rm -f "$NOTES"' EXIT
          RELEASE_SHA=$(git rev-parse HEAD)
          # The private action package is versioned and tagged but absent at refs
          # that predate it.
          PACKAGES="rules sdk cloudburn"
          if [ -f packages/action/package.json ]; then
            PACKAGES="$PACKAGES action"
          fi
          # The action warns rather than failing when a tag push is rejected.
          # Check every remote tag before any release can implicitly create one.
          for PACKAGE in $PACKAGES; do
            NAME=$(node -p "require('./packages/${PACKAGE}/package.json').name")
            VERSION=$(node -p "require('./packages/${PACKAGE}/package.json').version")
            TAG="${NAME}@${VERSION}"
            REMOTE_SHA=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" \
              | awk '$2 ~ /\^\{\}$/ { peeled=$1; next } { direct=$1 } END { print peeled ? peeled : direct }')
            test "$REMOTE_SHA" = "$RELEASE_SHA"
          done
          for PACKAGE in $PACKAGES; do
            NAME=$(node -p "require('./packages/${PACKAGE}/package.json').name")
            VERSION=$(node -p "require('./packages/${PACKAGE}/package.json').version")
            TAG="${NAME}@${VERSION}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              continue
            fi
            node scripts/changelog-notes.mjs "packages/${PACKAGE}/CHANGELOG.md" "$VERSION" > "$NOTES"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$NOTES"
          done

      - name: Label release pull request
        if: steps.changesets.outputs.pr-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label release

      - name: Update Homebrew tap
        if: >-
          github.ref == 'refs/heads/main' &&
          (inputs.published-release-ref != '' ||
           (steps.changesets.outputs.published == 'true' &&
            contains(steps.changesets.outputs.published-packages, '"cloudburn"')))
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/cloudburn/package.json').version")
          TARBALL_URL="https://registry.npmjs.org/cloudburn/-/cloudburn-${VERSION}.tgz"

          # Retry up to 5 times to handle npm CDN propagation delay
          for i in 1 2 3 4 5; do
            SHA256=$(curl -sfSL "$TARBALL_URL" | shasum -a 256 | cut -d ' ' -f 1) && break
            SHA256=""
            echo "Tarball not yet available, retrying in 15s (attempt $i/5)..."
            sleep 15
          done

          if [ -z "$SHA256" ]; then
            echo "::error::Failed to download tarball after 5 attempts"
            exit 1
          fi

          cat > /tmp/cloudburn.rb <<FORMULA
          class Cloudburn < Formula
            desc "CLI for cloud cost optimization"
            homepage "https://cloudburn.io/docs"
            url "${TARBALL_URL}"
            sha256 "${SHA256}"
            license "Apache-2.0"

            depends_on "node"

            def install
              system "npm", "install", *std_npm_args
              bin.install_symlink libexec.glob("bin/*")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/cloudburn --version")
            end
          end
          FORMULA
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/cloudburn.rb

          # Push updated formula to the homebrew tap repo
          CONTENT=$(base64 -w 0 < /tmp/cloudburn.rb)
          EXISTING_SHA=$(curl -sf -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            "https://api.github.com/repos/towardsthecloud/homebrew-tap/contents/Formula/cloudburn.rb" \
            | jq -r '.sha // empty') || EXISTING_SHA=""

          JSON_PAYLOAD=$(jq -n \
            --arg message "chore: update cloudburn to ${VERSION}" \
            --arg content "$CONTENT" \
            --arg sha "$EXISTING_SHA" \
            'if $sha == "" then {message: $message, content: $content} else {message: $message, content: $content, sha: $sha} end')

          curl -sfS -X PUT \
            -H "Authorization: token $HOMEBREW_TAP_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/towardsthecloud/homebrew-tap/contents/Formula/cloudburn.rb" \
            -d "$JSON_PAYLOAD"

      - name: Sync GitHub Action
        if: >-
          github.ref == 'refs/heads/main' &&
          (inputs.published-release-ref != '' ||
           (steps.changesets.outputs.published == 'true' &&
            contains(steps.changesets.outputs.published-packages, '"@cloudburn/action"')))
        env:
          ACTION_REPO_TOKEN: ${{ secrets.ACTION_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.ACTION_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_REPO="towardsthecloud/cloudburn-action"

          if [ ! -f packages/action/package.json ]; then
            echo "No action package at this ref; skipping sync."
            exit 0
          fi

          VERSION=$(node -p "require('./packages/action/package.json').version")
          TAG="v${VERSION}"
          MAJOR="v${VERSION%%.*}"
          REMOTE="https://x-access-token:${ACTION_REPO_TOKEN}@github.com/${TARGET_REPO}.git"

          # A higher remote version means this run recovers an older release:
          # heal only its tag and release, never the default branch, the
          # floating major tag, or the "latest" release marker.
          # --refs drops peeled ^{} entries and the v*.*.* pattern excludes
          # floating major tags, which sort as newer than any same-major version.
          REMOTE_MAX=$(git ls-remote --tags --refs "$REMOTE" 'refs/tags/v*.*.*' | sed 's|.*/v||' | sort -V | tail -n1 || true)
          STALE=""
          if [ -n "$REMOTE_MAX" ] && [ "$REMOTE_MAX" != "$VERSION" ] \
            && [ "$(printf '%s\n%s\n' "$VERSION" "$REMOTE_MAX" | sort -V | tail -n1)" = "$REMOTE_MAX" ]; then
            STALE=1
            echo "Remote already has ${MAJOR} version ${REMOTE_MAX}; syncing ${TAG} as an older release."
          fi

          pnpm exec turbo run build --filter @cloudburn/action
          test -f packages/action/dist/index.cjs
          test -f packages/action/dist/main.wasm.gz

          NOTES=$(mktemp)
          trap 'rm -f "$NOTES"' EXIT
          node scripts/changelog-notes.mjs packages/action/CHANGELOG.md "$VERSION" --fallback > "$NOTES"

          git clone --depth 1 "$REMOTE" action-target
          cp packages/action/action.yml packages/action/README.md LICENSE action-target/
          mkdir -p action-target/dist
          cp packages/action/dist/index.cjs packages/action/dist/main.wasm.gz action-target/dist/

          cd action-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Load-bearing when the target repo is empty or its default branch differs.
          git checkout -B main
          git add -A
          if git diff --staged --quiet; then
            echo "No content changes for ${TAG}."
          else
            git commit -m "chore: sync cloudburn-action ${TAG}"
            if [ -z "$STALE" ]; then
              git push origin HEAD:main
            fi
          fi

          # Each artifact is reconciled independently so re-runs heal partial syncs.
          if [ -z "$(git ls-remote --tags --refs origin "refs/tags/${TAG}")" ]; then
            # -f: a shallow clone can carry a stale local tag.
            git tag -f -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if [ -z "$STALE" ]; then
            git tag -f -a "$MAJOR" -m "Update $MAJOR to $TAG"
            git push origin --force "$MAJOR"
          fi
          if ! gh release view "$TAG" --repo "$TARGET_REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$TARGET_REPO" --verify-tag --title "$TAG" \
              --notes-file "$NOTES" ${STALE:+--latest=false}
          fi
