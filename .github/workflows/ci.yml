name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hosted runners have 4 vCPUs. Turbo's default concurrency runs every package's Vitest suite, the CLI
      # end-to-end tests, lint, and typecheck at once, which stretches timer-paced integration tests past their budgets.
      - name: Verify affected packages and repository checks
        if: github.event_name == 'pull_request'
        run: pnpm verify --affected --concurrency=2

      - name: Verify the complete workspace
        if: github.event_name != 'pull_request'
        run: pnpm verify --concurrency=2
